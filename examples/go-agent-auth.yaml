---
apiVersion: adl.inference-gateway.com/v1
kind: Agent
metadata:
  name: go-agent-auth
  description: "Agent advertising A2A card-driven authentication (spec section 7)"
  version: "0.1.0"
spec:
  capabilities:
    streaming: true
    pushNotifications: false
    # Extended, authenticated card served via agent/getAuthenticatedExtendedCard.
    extendedAgentCard: true
  card:
    supportedInterfaces:
      - url: "https://my-agent.example.com:8443"
        protocolBinding: JSONRPC
        protocolVersion: "1.0"
    # Statically declared schemes (apiKey / http / mutualTLS). OIDC/OAuth2 are
    # intentionally NOT declared here - the ADK derives them from runtime config
    # (A2A_AUTH_* env) when spec.server.auth.enabled is true.
    securitySchemes:
      apiKey:
        type: apiKey
        description: "API key passed in the X-API-Key header"
        name: X-API-Key
        in: header
      bearer:
        type: http
        description: "JWT bearer token"
        scheme: Bearer
        bearerFormat: JWT
    securityRequirements:
      - apiKey: []
      - bearer: []
  agent:
    provider: deepseek
    model: deepseek-v4-flash
    systemPrompt: |
      You are a helpful assistant.
    maxTokens: 4096
    temperature: 0.3
  server:
    port: 8443
    scheme: https
    debug: false
    auth:
      enabled: true
  language:
    go:
      module: "github.com/inference-gateway/adl-cli/test-output"
      version: "1.26.8"
  development:
    sandbox:
      flox:
        enabled: false
      devcontainer:
        enabled: false
      dockerCompose:
        enabled: true
