---
apiVersion: adl.inference-gateway.com/v1
kind: Agent
metadata:
  name: go-agent-telemetry
  description: "Go A2A agent wired for OpenTelemetry - metrics server, OTLP traces, and per-tool-call spans"
  version: "0.1.0"
spec:
  capabilities:
    streaming: true
    pushNotifications: false
    stateTransitionHistory: false
  card:
    protocolVersion: "0.3.0"
    preferredTransport: JSONRPC
    defaultInputModes:
      - text
    defaultOutputModes:
      - text
  agent:
    provider: deepseek
    model: deepseek-v4-flash
    systemPrompt: |
      You are an observability-friendly assistant. Investigate files with the
      Read tool and run whitelisted shell commands with Bash. Every built-in
      tool call is traced as its own span so per-tool-call latency shows up in
      the tracing backend.
    maxTokens: 4096
    temperature: 0.3
  # spec.telemetry configures OpenTelemetry instrumentation. 'enabled' is the
  # master switch: the generator pulls the OpenTelemetry runtime dependencies
  # into go.mod, instruments the built-in tool calls with spans
  # (tools/telemetry.go), and surfaces A2A_TELEMETRY_ENABLE plus the standard
  # OTEL_* exporter variables in .env.example. Each per-signal exporter maps 1:1
  # to the OTEL_* names the OpenTelemetry SDK reads. Here traces push over OTLP
  # while metrics are exposed for Prometheus scraping (a pull endpoint). Auth
  # headers, credentials, and sampling stay runtime concerns.
  telemetry:
    enabled: true
    traces:
      exporter:
        otlp:
          endpoint: http://localhost:4318
          protocol: http/protobuf
    metrics:
      exporter:
        prometheus:
          port: 9464
  config:
    tools:
      read:
        enabled: true
        max_lines: 2000
      bash:
        enabled: true
        whitelist:
          - ls
          - cat
          - grep
          - find
        timeout_seconds: 30
  tools:
    - id: read
    - id: bash
  server:
    port: 8080
    scheme: http
    debug: false
    auth:
      enabled: false
  language:
    go:
      module: "github.com/inference-gateway/adl-cli/test-output"
      version: "1.26.4"
  development:
    sandbox:
      flox:
        enabled: true
      devcontainer:
        enabled: false
      dockerCompose:
        enabled: true
