---
name: Generate examples

# Runs `task examples:generate` and opens a PR if the generated output
# differs from what is committed.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate examples and open PR
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate examples
        run: task examples:generate

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/generate-examples
          commit-message: "chore: regenerate example agent projects"
          title: "chore: regenerate example agent projects"
          body: |
            ## Summary

            Regenerates all example agent projects under `test-output/` by running
            `task examples:generate`. This keeps the generated output in sync with
            the latest templates and manifest changes.

            ## Changes

            - Updated generated agent projects in `test-output/`
          labels: |
            automated
