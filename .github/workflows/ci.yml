---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --help

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "lts/*"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Run markdownlint
        run: markdownlint '**/*.md' --ignore CHANGELOG.md

      - name: Tidy Go modules
        run: find . -name 'go.mod' -execdir go mod tidy \;

      - name: Check dirty
        run: git diff --exit-code

      - name: Run Lint
        run: golangci-lint run

      - name: Build
        run: go build .

      - name: Test
        run: go test -v ./...

  # Detect drift in generated example projects on push to main.
  # Runs `task examples:generate` and opens a PR if the output differs.
  drift:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate examples
        run: task examples:generate

      - name: Check for drift
        id: drift
        run: |
          if ! git diff --quiet -- test-output/; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/generate-examples
          commit-message: "chore: regenerate example agent projects"
          title: "chore: regenerate example agent projects"
          body: |
            ## Summary

            Regenerates all example agent projects under `test-output/` by running
            `task examples:generate`. This keeps the generated output in sync with
            the latest templates and manifest changes.

            ## Changes

            - Updated generated agent projects in `test-output/`
          labels: automated
